<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Marea Grill — Menú</title>
<style>
  :root{
    --navy:#123A5C;
    --ocean-deep:#0C4A73;
    --ocean:#1C77BE;
    --sky:#BFE7F5;
    --sand:#F4E3B8;
    --cream:#FBF7EC;
    --ink:#0B2A40;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    background:linear-gradient(180deg, var(--sky) 0%, var(--cream) 45%, var(--sand) 100%);
    color:var(--navy);
    font-family:-apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    width:100%;
    overflow-x:hidden;
  }
  button{font-family:inherit;}
  button:focus-visible{outline:3px solid var(--ocean-deep);outline-offset:2px;}

  .screen{display:none;}
  .screen.active{display:block;}

  /* ---------- HOME / PORTADA ---------- */
  #screen-home{
    position:relative;
    max-width:520px;
    margin:0 auto;
  }
  #screen-home img{
    display:block;width:100%;height:auto;
  }
  .hotspot{
    position:absolute;
    background:rgba(0,0,0,0);
    border:none;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  /* Coordenadas aproximadas sobre la imagen 900x1600 */
  .hotspot-desayuno{
    left:6%;   top:63.9%;
    width:40%; height:7.2%;
  }
  .hotspot-almuerzo{
    left:53.3%; top:63.9%;
    width:40.6%; height:7.2%;
  }
  .hotspot:active{background:rgba(28,119,190,0.2);border-radius:40px;}

  /* ---------- VISOR DE MENÚ ---------- */
  #screen-desayuno, #screen-almuerzo{
    min-height:100vh;
    padding-top:70px;
  }
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    background:var(--navy);
    padding:16px 18px;
  }
  .topbar .title{
    font-weight:800;color:var(--sky);font-size:1.1rem;
    letter-spacing:0.02em;text-transform:uppercase;
  }
  .home-btn{
    display:flex;align-items:center;gap:6px;
    background:var(--ocean);color:#fff;
    border:none;border-radius:20px;
    padding:10px 20px;font-size:0.9rem;font-weight:800;
    text-transform:uppercase;letter-spacing:0.02em;
    cursor:pointer;
  }
  .home-btn:hover{background:var(--ocean-deep);}

  .pages{
    max-width:760px;margin:0 auto;
    display:flex;flex-direction:column;gap:24px;
    padding:20px 14px 24px;
  }
  .zoom-wrap{
    border-radius:10px;
    overflow:auto;
    box-shadow:0 12px 32px rgba(11,42,64,0.25);
    background:#fff;
    -webkit-overflow-scrolling:touch;
  }
  .zoom-wrap img{
    display:block;
    width:100%;
    height:auto;
    cursor:zoom-in;
    transition:width .25s ease;
  }
  .zoom-wrap.zoomed{
    overflow:auto;
  }
  .zoom-wrap.zoomed img{
    width:220%;
    max-width:none;
    cursor:zoom-out;
  }
  .zoom-hint{
    text-align:center;
    font-size:0.95rem;font-weight:700;color:var(--navy);
    background:var(--sand);
    border-radius:30px;
    padding:10px 18px;
    margin:0 auto 4px;
    max-width:fit-content;
    display:flex;align-items:center;gap:8px;
  }

  footer{
    background:var(--navy);
    padding:20px 0;text-align:center;
    color:var(--sky);
  }
  footer .thanks{font-size:1.05rem;font-weight:700;color:var(--sand);margin-bottom:6px;}
  footer .meta{font-size:0.78rem;color:var(--sky);opacity:0.85;}
</style>
</head>
<body>

<!-- ============ PORTADA ============ -->
<section class="screen active" id="screen-home">
  <img src="assets/portada.jpg" alt="Marea Grill — Menús">
  <button class="hotspot hotspot-desayuno" aria-label="Ver menú de desayuno" onclick="showScreen('desayuno')"></button>
  <button class="hotspot hotspot-almuerzo" aria-label="Ver menú de almuerzo" onclick="showScreen('almuerzo')"></button>
</section>

<!-- ============ DESAYUNO ============ -->
<section class="screen" id="screen-desayuno">
  <div class="topbar">
    <span class="title">Desayuno</span>
    <button class="home-btn" onclick="showScreen('home')">⌂ Inicio</button>
  </div>
  <div class="pages">
    <p class="zoom-hint">🔍 Toca la página para agrandar</p>
    <div class="zoom-wrap" onclick="toggleZoom(this)"><img src="assets/pagina-1.jpg" alt="Menú de desayunos" loading="lazy"></div>
  </div>
  <footer>
    <div class="thanks">Gracias por elegirnos</div>
  </footer>
</section>

<!-- ============ ALMUERZO ============ -->
<section class="screen" id="screen-almuerzo">
  <div class="topbar">
    <span class="title">Almuerzo</span>
    <button class="home-btn" onclick="showScreen('home')">⌂ Inicio</button>
  </div>
  <div class="pages">
    <p class="zoom-hint">🔍 Toca la página para agrandar</p>
    <div class="zoom-wrap" onclick="toggleZoom(this)"><img src="assets/pagina-2.jpg" alt="Menú de almuerzos" loading="lazy"></div>
  </div>
  <footer>
    <div class="thanks">«Gracias por elegirnos»</div>
    <div class="meta">Marea Grill · /MareaGrill</div>
  </footer>
</section>

<script>
  function showScreen(name){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');
    window.scrollTo({top:0, behavior:'instant'});
  }
  function toggleZoom(wrap){
    wrap.classList.toggle('zoomed');
    if(!wrap.classList.contains('zoomed')){
      wrap.scrollLeft = 0;
      wrap.scrollTop = 0;
    }
  }
</script>

</body>
</html>
